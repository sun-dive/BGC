<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0b0d10;color:#e6eaef;display:flex;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* left 2/3 — logo + mission */
  .left{width:780px;height:630px;position:relative;display:flex;flex-direction:column;justify-content:center;
    padding:0 60px 0 70px;
    background-image:
      radial-gradient(560px 400px at 20% 0%, rgba(127,176,221,.10), transparent 62%),
      linear-gradient(#1c222b 1px, transparent 1px),
      linear-gradient(90deg,#1c222b 1px, transparent 1px);
    background-size:auto,52px 52px,52px 52px}
  .eyebrow{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:#7fb0dd;font-weight:600}
  .lock{display:flex;align-items:center;gap:16px;margin:20px 0 4px}
  .lock .cube{width:58px;display:block}
  .lock .wm{font-size:52px;font-weight:700;letter-spacing:-.01em;line-height:1}
  .lock .wm span{color:#7fb0dd}
  .lock .wm sup{font-size:.24em;color:#5c646f;font-weight:500}
  .corp{font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:#8b939e;padding-left:.3em}
  .thesis{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-weight:400;font-size:44px;
    line-height:1.12;color:#eef2f6;margin:30px 0 0;max-width:15ch}
  .motto{margin-top:20px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#5c646f}
  /* right 1/3 — CEO on stage */
  .right{width:420px;height:630px;position:relative;overflow:hidden;background:linear-gradient(160deg,#171c24,#0d1116)}
  .right .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#5c646f;
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;line-height:2.2}
  .right img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
  .right::after{content:"";position:absolute;inset:0;z-index:2;
    background:linear-gradient(90deg,#0b0d10 0%, rgba(11,13,16,.55) 14%, transparent 42%)}
</style></head>
<body>
  <div class="left">
    <div class="eyebrow">Established · MMIX</div>
    <div class="lock">
      <svg class="cube" viewBox="-56 -64 112 128">
        <defs>
          <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3dde8"/><stop offset="1" stop-color="#a9b8c8"/></linearGradient>
          <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8496a8"/><stop offset="1" stop-color="#617386"/></linearGradient>
          <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#51606f"/><stop offset="1" stop-color="#374350"/></linearGradient>
        </defs>
        <polygon points="0,-52 45,-26 0,0 -45,-26" fill="url(#gt)"/>
        <polygon points="-45,-26 0,0 0,52 -45,26" fill="url(#gl)"/>
        <polygon points="45,-26 0,0 0,52 45,26" fill="url(#gr)"/>
        <g stroke="#0b0d10" stroke-width="1.4" fill="none" opacity=".5">
          <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"/>
          <path d="M0,-52 L0,0 M-45,-26 L0,0 M45,-26 L0,0 M0,0 L0,52"/>
        </g>
        <path d="M-45,-26 L0,-52 L45,-26" fill="none" stroke="#7fb0dd" stroke-width="1.4" opacity=".8"/>
        <g font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.02em">
          <text transform="matrix(0.866,0.5,-0.866,0.5,0,-25)" font-size="40" fill="#243642">G</text>
          <text transform="matrix(0.866,0.5,0,1,-22.5,12)" font-size="40" fill="#eef2f6">B</text>
          <text transform="matrix(0.866,-0.5,0,1,22.5,12)" font-size="40" fill="#eef2f6">C</text>
        </g>
      </svg>
      <div class="wm">bit<span>graf</span><sup>™</sup></div>
    </div>
    <div class="corp">Bit Graf Corporation</div>
    <div class="thesis">We do not create. We own what is created.</div>
    <div class="motto">Omnia Nostra · Enclosed · Governed · In Perpetuity</div>
  </div>
  <div class="right">
    <span class="ph">CEO<br>keynote<br><small>portrait</small></span>
    <img src="ceo-stage.jpg" alt="" onerror="this.remove()">
  </div>
</body></html>
